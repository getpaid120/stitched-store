name: Sync Products & Update Store

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Search keywords (comma separated)'
        required: false
        default: 'wireless earbuds,led desk lamp,bluetooth speaker,phone stand,water bottle,hoodie'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch products
        id: scrape
        run: python3 .github/scripts/scrape_aliexpress.py

      - name: Commit and push updates
        run: |
          git config user.name "Stitched Bot"
          git config user.email "bot@stitched.store"
          git add products.json
          git diff --staged --quiet || ( \
            git commit -m "Auto: update products from AliExpress [$(date -u '+%Y-%m-%d')]" && \
            git push \
          )
